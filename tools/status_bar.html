<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>今日投递 · 状态栏</title>
<style>
:root{--card:#faf9f5;--ink:#3d3929;--mute:#83827d;--line:#e8e6dc;--acc:#d97757;--warn:#c4472d}
@media(prefers-color-scheme:dark){:root{--card:#30302e;--ink:#faf9f5;--mute:#a09f99;--line:#43433f;--warn:#ec8a70}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;user-select:none}
body{font:13px/1.25 "Noto Sans SC","Microsoft YaHei UI",sans-serif;background:var(--acc);color:#fff;cursor:pointer}
#r{height:100%}
.g{flex:none;width:16px;align-self:stretch;display:flex;align-items:center;justify-content:center;cursor:move;opacity:.65;font-size:13px;letter-spacing:-3px}
.g:hover{opacity:1}
.row{height:100%;display:flex;align-items:center;gap:9px;padding:0 10px 0 4px;white-space:nowrap}
.n{font:700 15px Georgia,serif}
.sep{width:1px;height:13px;background:rgba(255,255,255,.45);flex:none}
.pb{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);flex:none;overflow:hidden}
.pb i{display:block;height:100%;background:#fff}
.dl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fill{flex:1;min-width:0}
.ch{flex:none;font-size:10px;transition:transform .15s}
body.open .ch{transform:rotate(180deg)}
body.pulse{animation:pl 1s ease-in-out 6}
@keyframes pl{50%{filter:brightness(1.2)}}
body.card{background:var(--card);color:var(--ink)}
body.card .g{color:var(--mute)}
.cd{height:100%;display:flex;align-items:center;gap:10px;padding:0 12px 0 2px}
.ring{flex:none;position:relative;width:58px;height:58px}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 15px Georgia,serif}
.ci{min-width:0;flex:1}
.ci .k{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .k.hot{color:var(--warn)}
.ci .co{font:700 14px/1.35 "Noto Serif SC",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .ti{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.ci .bt{display:flex;gap:6px}
.ci button{font:inherit;font-size:12px;font-weight:500;border-radius:7px;padding:2px 10px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ci button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.ci button:hover{border-color:var(--acc)}
body.pill .row{gap:8px;padding-right:14px}
</style></head><body><div id="r"></div>
<script>
const T=new URLSearchParams(location.search).get('t');
let B=null,PT=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'X-T':T},body:b?JSON.stringify(b):undefined});return r.json()}
function dl(j){return j.left===null?'招满即止':j.left===0?'今天截止':j.left===1?'明天截止':j.left<=7?j.left+' 天后截止':j.date+' 截止'}
const G='<div class="g pywebview-drag-region" title="按住拖动">⋮⋮</div>';
function strip(b,fin){
 const pools=[['hk','港'],['cn','陆']].filter(([k])=>b[k].n).map(([k,l])=>l+' '+b[k].a+'/'+b[k].n).join(' · ');
 const nx=b.next,pct=b.den?b.done/b.den*100:0;
 const mid=fin?`今天的都投完了 · 本周已投 ${b.week} 家`:nx?`最近截止：${esc(nx.company)} · ${dl(nx)}`:'今天没有要投的';
 return `<div class="row">${G}<span>今日投递 <b class="n">${b.done}/${b.den}</b></span><span class="pb"><i style="width:${pct}%"></i></span>`+
  (pools?`<span class="sep"></span><span>${pools}</span>`:'')+
  `<span class="sep"></span><span class="dl fill">${mid}</span>`+
  (b.new?`<span class="sep"></span><span>新岗 +${b.new}</span>`:'')+`<span class="ch">▼</span></div>`}
function card(b,fin){
 const nx=b.next,C=2*Math.PI*24,f=b.den?b.done/b.den:0;
 const ring=`<div class="ring"><svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="29" cy="29" r="24" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 29 29)" ${f?'':'opacity="0"'}/></svg><b>${b.done}/${b.den}</b></div>`;
 const extra=b.new?` · 新岗 +${b.new}`:'';
 const info=fin?`<div class="k">今日投递${extra}</div><div class="co">今天的都投完了</div><div class="ti">本周已投 ${b.week} 家</div><div class="bt"><button data-a="panel">打开面板</button></div>`
  :nx?`<div class="k ${nx.left!==null&&nx.left<=1?'hot':''}">下一家 · ${dl(nx)}${extra}</div><div class="co">${esc(nx.company)}</div><div class="ti">${esc(nx.title)}</div><div class="bt">${nx.url?'<button class="p" data-a="url">打开投递页</button>':''}<button data-a="panel">面板</button></div>`
  :`<div class="k">今日投递${extra}</div><div class="co">今天没有要投的</div><div class="ti">本周已投 ${b.week} 家</div><div class="bt"><button data-a="panel">打开面板</button></div>`;
 return `<div class="cd">${G}${ring}<div class="ci">${info}</div></div>`}
function pill(b,fin){
 const seg=[];if(fin)seg.push('投完了 ✓');else if(b.urgent)seg.push('快截止 '+b.urgent);if(b.new)seg.push('新岗 +'+b.new);
 return `<div class="row">${G}<b class="n">${b.done}/${b.den}</b>${seg.map(x=>`<span class="sep"></span><span>${x}</span>`).join('')}<span class="fill"></span><span class="ch">▼</span></div>`}
function render(){
 const b=B,fin=b.den>0&&!b.pending;
 document.body.className=b.style+(b.open?' open':'')+(PT?' pulse':'');
 $('#r').innerHTML=(b.style==='card'?card:b.style==='pill'?pill:strip)(b,fin);
 document.title='今日投递 · 状态栏'}
async function load(){B=await api('/api/bar');render()}
window.refresh=()=>load().catch(()=>{});
window.barPanel=on=>{if(B){B.open=on;document.body.classList.toggle('open',on)}};
window.pulse=()=>{clearTimeout(PT);PT=setTimeout(()=>{PT=null;document.body.classList.remove('pulse')},6500);document.body.classList.add('pulse')};
document.addEventListener('click',e=>{
 if(e.target.closest('.g'))return;
 const a=(e.target.closest('[data-a]')||{}).dataset;
 if(a&&a.a==='url'&&B.next)api('/api/open',{id:B.next.id,what:'url'});
 else api('/api/dock',{op:'toggle'})});
window.refresh();setInterval(window.refresh,60000);
</script></body></html>
