<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>今日投递</title>
<style>
:root{--bg:#f5f4ed;--card:#faf9f5;--ink:#3d3929;--mute:#83827d;--line:#e8e6dc;--acc:#d97757;--acc-ink:#fff;--ok:#6b8e5a;--warn:#c4472d;--amber:#d9a557;--gray:#cfcdc2;--chip:#f0eee6}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--ink:#faf9f5;--mute:#a09f99;--line:#43433f;--ok:#8fb27c;--warn:#ec8a70;--amber:#e0b46a;--gray:#5d5c57;--chip:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans SC","Microsoft YaHei UI",sans-serif;overflow:hidden}
.serif{font-family:"Noto Serif SC",Georgia,serif;font-weight:700}
#app{height:100%;display:flex;flex-direction:column;padding:14px 18px 0}
header{display:flex;align-items:center;gap:12px;padding-bottom:6px;cursor:move;user-select:none}
header h1{font:700 22px/1.2 "Noto Serif SC",Georgia,serif;margin:0}
#cnt{color:var(--mute);font-size:13px;flex:1}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 12px;flex:none}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s}
main{flex:1;overflow-y:auto;padding-bottom:34px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.col h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.applied,.row.later,.row.blocked{opacity:.55}
.row.applied .co{text-decoration:line-through}
.row.open{background:var(--bg)}
.hd{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.r{background:var(--warn)}.dot.a{background:var(--amber)}.dot.g{background:var(--gray)}
.co{font:700 15px/1.3 "Noto Serif SC",Georgia,serif;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.hot{color:var(--warn);border-color:var(--warn)}
.ti{font-size:13px;margin:1px 0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.open .ti{display:block}
.meta{font-size:12px;color:var(--mute);margin-left:16px}
.ex{margin:10px 0 2px 16px;padding-top:10px;border-top:1px dashed var(--line)}
.lab{font-size:11.5px;color:var(--mute);margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{font:inherit;font-size:12px;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--mute);margin-right:5px;font-size:11px}
.chip:hover{border-color:var(--acc)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.line .k{font-size:12px;color:var(--mute);width:44px}
button,.btn{font:inherit;font-size:13px;font-weight:500;border-radius:9px;padding:5px 13px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.p:hover{filter:brightness(1.07)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.sm{font-size:12px;padding:2px 10px}
button.lnk{border:0;padding:0 2px;color:var(--mute);font-size:12px}
button.dis{opacity:.5;cursor:default}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reasons{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.reasons .chips{margin:4px 0 0}
.confirm{font-size:12.5px;color:var(--warn);margin:8px 0 4px}
input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 9px;flex:1;min-width:120px}
.nolink{color:var(--mute);font-size:12.5px;align-self:center}
.morebtn{display:block;width:100%;margin-top:7px;font-size:12.5px;color:var(--mute)}
.empty{margin-top:7px;border:1px dashed var(--warn);border-radius:10px;padding:7px 10px;color:var(--warn);font-size:12.5px}
.all{text-align:center;padding:10px 0 4px;font:700 18px "Noto Serif SC",Georgia,serif}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sum b{display:block;font:700 19px "Noto Serif SC",Georgia,serif}
.sum span{font-size:11.5px;color:var(--mute)}
.sub{font-size:12px;color:var(--mute);margin-top:6px;text-align:center}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:.92}#toast.err{background:var(--warn);color:#fff}
#handle{position:fixed;left:0;right:0;bottom:0;height:24px;pointer-events:none}
#handle .strip{position:absolute;left:0;right:0;top:0;height:6px;background:var(--acc)}
#handle .tab{position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:24px;border-radius:0 0 8px 8px;background:var(--acc);color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
</style></head><body>
<div id="app">
 <header class="pywebview-drag-region"><h1>今日投递</h1><span id="cnt"></span>
  <button class="sm" data-a="hide" title="缩回顶边">收起</button><button class="sm" data-a="quit" id="quitbtn">退出</button></header>
 <div class="bar"><i id="bar"></i></div>
 <main><div id="done"></div><div class="cols" id="cols"></div><div id="sum"></div></main>
</div>
<div id="toast"></div>
<div id="handle"><div class="strip"></div><div class="tab" data-a="hide" id="tab">投递</div></div>
<script>
const T=new URLSearchParams(location.search).get('t');
let S=null,open=null,blockFor=null,pendReason=null,moreFields=false,quitArmed=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){
 const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-T':T},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function load(){S=await api('/api/state');render()}
window.onShow=()=>load().catch(()=>{});
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',err?4000:1600)}
async function post(path,body,msg){try{const d=await api(path,body);if(d&&d.jobs){S=d;render()}if(msg)toast(msg);return true}catch(e){toast('出错：'+e.message,true);return false}}

const ORDER={pending:0,later:1,applied:2,blocked:3};
function dot(j){return j.left===null?'g':j.left<=1?'r':j.left<=30?'a':'g'}
function pill(j){
 if(j.status==='applied')return '<span class="pill">已投</span>';
 if(j.status==='later')return '<span class="pill">稍后 · 明天再来</span>';
 if(j.status==='blocked')return '<span class="pill">已屏蔽</span>';
 if(j.left===null)return '<span class="pill">招满即止</span>';
 const t=j.left===0?'今天截止':j.left===1?'明天截止':j.date+' · 剩 '+j.left+' 天';
 return '<span class="pill '+(j.left<=1?'hot':'')+'">'+t+'</span>'}
function short(f){let l=f.label.split(/\s+/)[0];if(f.sec.includes('本科'))l='本科·'+l;return l}
function chip(f){return f.vals.map(v=>`<button class="chip" data-a="copy" data-v="${esc(v)}" data-l="${esc(f.label)}" title="${esc(f.tip||f.label)}"><small>${esc(short(f))}</small>${esc(v)}</button>`).join('')}
function ex(j){
 const k=j.pool,prim=S.fields.filter(f=>f[k]!==null).sort((a,b)=>a[k]-b[k]),rest=S.fields.filter(f=>f[k]===null);
 let h=`<div class="ex"><div class="lab">点一下复制</div><div class="chips">${prim.map(chip).join('')}</div>`;
 h+=`<button class="lnk" data-a="morefields">${moreFields?'收起更多字段 ▴':'更多字段（'+rest.length+'） ▾'}</button>`;
 if(moreFields)h+=`<div class="chips" style="margin-top:6px">${rest.map(chip).join('')}</div>`;
 h+=`<div class="line"><span class="k">简历</span><button class="sm" data-a="res-copy">复制路径</button><button class="sm" data-a="res-view">预览</button></div>`;
 if(j.need_cl){
  let c;if(j.cl.pdf)c='<button class="sm" data-a="cl-copy">复制路径</button><button class="sm" data-a="cl-edit">编辑</button>';
  else if(j.cl.md)c='<button class="sm" data-a="cl-edit">编辑</button><button class="sm" data-a="cl-pdf">生成 PDF</button>';
  else c='<button class="sm" data-a="cl-draft">起草</button>';
  h+=`<div class="line"><span class="k">求职信</span>${c}${k==='cn'?'<button class="lnk" data-a="needcl" data-on="0">不需要</button>':''}</div>`;
 }else h+=`<div class="line"><span class="k">求职信</span><button class="lnk" data-a="needcl" data-on="1">这家需要求职信 →</button></div>`;
 h+=`<div class="act">${j.url?'<button class="p" data-a="url">打开投递页 ↗</button>':'<span class="nolink">无链接，需手动搜</span>'}
  <button class="ok" data-a="applied">已投</button><button data-a="later">稍后</button><button data-a="block">屏蔽 ${blockFor===j.id?'▴':'▾'}</button></div>`;
 if(blockFor===j.id){
  h+=`<div class="reasons"><div class="lab">屏蔽原因</div><div class="chips">${Object.entries(S.reasons).map(([r,l])=>`<button class="chip" data-a="reason" data-r="${r}" style="${pendReason===r?'border-color:var(--acc)':''}">${l}</button>`).join('')}</div>`;
  if(pendReason==='company')h+=`<div class="confirm">将屏蔽「${esc(j.company)}」的全部岗位（公司名包含这几个字的都算），以后都不再推。</div><div class="line"><button class="p sm" data-a="confirm">确定屏蔽</button><button class="sm" data-a="cancel">取消</button></div>`;
  if(pendReason==='other')h+=`<div class="line"><input type="text" id="note" placeholder="写一句原因，方便以后调规则"><button class="p sm" data-a="confirm">确定</button></div>`;
  h+='</div>'}
 return h+'</div>'}
function row(j){
 const o=open===j.id&&j.status==='pending';
 const meta=[j.type,j.city==='香港'?'':j.city,j.later?'已推迟 '+j.later+' 次':''].filter(Boolean).join(' · ');
 return `<div class="row ${j.status} ${o?'open':''}" data-id="${esc(j.id)}">
 <div class="hd" data-a="toggle"><span class="dot ${dot(j)}"></span><span class="co">${esc(j.company)}</span>${pill(j)}${j.status!=='pending'?'<button class="sm" data-a="undo">撤销</button>':''}</div>
 <div class="ti">${esc(j.title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}${o?ex(j):''}</div>`}
function render(){
 const js=S.jobs,c={pending:0,applied:0,later:0,blocked:0};js.forEach(j=>c[j.status]++);
 const den=c.pending+c.applied;
 $('#cnt').textContent=`待投 ${c.pending} · 稍后 ${c.later} · 已投 ${c.applied} · 屏蔽 ${c.blocked}`;
 $('#bar').style.width=(den?c.applied/den*100:0)+'%';
 $('#tab').textContent=c.pending?`投递 ${c.applied}/${den}`:'✓ 今日完成';
 $('#done').innerHTML=js.length&&!c.pending?'<div class="all">今天的都处理完了</div>':'';
 $('#cols').innerHTML=[['hk','香港'],['cn','大陆']].map(([k,l])=>{
  const rows=js.filter(j=>j.pool===k).sort((a,b)=>ORDER[a.status]-ORDER[b.status]);
  const rem=S.remain[k];
  return `<section class="col"><h4><span>${l}</span><span>可补 ${rem}</span></h4>
  <div class="box">${rows.map(row).join('')||'<div class="row nolink">今天没有</div>'}</div>
  ${rem?`<button class="morebtn" data-a="more" data-pool="${k}">+ 再来 ${Math.min(5,rem)} 家</button>`:`<div class="empty">${k==='hk'?'香港':'大陆'}池已空，今天没法再补。要新岗得开会话重新搜。</div>`}</section>`}).join('');
 const st=S.stats;
 $('#sum').innerHTML=`<div class="sum"><div><b>${st.today}</b><span>今日已投</span></div><div><b>${st.week}</b><span>本周已投</span></div><div><b>${st.total}</b><span>累计已投</span></div><div><b>${S.remain.hk} / ${S.remain.cn}</b><span>港池 / 陆池可补</span></div></div>
 <div class="sub">今日屏蔽 ${st.blocked_today} · 稍后 ${st.later_today}　·　本周/今日只从 v2 面板上线后开始计</div>`}
function nextOpen(pool){const n=S.jobs.find(j=>j.pool===pool&&j.status==='pending');open=n?n.id:null}
async function doAct(id,act,reason,note){
 const pool=(S.jobs.find(j=>j.id===id)||{}).pool;blockFor=pendReason=null;
 if(await post('/api/act',{id,act,reason,note})){if(act!=='undo'){nextOpen(pool);render()}}}
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,r=el.closest('.row'),id=r&&r.dataset.id;
 if(a!=='quit'&&quitArmed){quitArmed=false;$('#quitbtn').textContent='退出'}
 switch(a){
 case'toggle':open=open===id?null:id;blockFor=pendReason=null;render();break;
 case'morefields':moreFields=!moreFields;render();break;
 case'copy':post('/api/clip',{text:el.dataset.v},'已复制：'+el.dataset.l);break;
 case'res-copy':post('/api/clip',{id,what:'resume'},'已复制简历路径，去上传框里 Ctrl+V');break;
 case'res-view':post('/api/open',{id,what:'resume'});break;
 case'cl-copy':post('/api/clip',{id,what:'cl'},'已复制求职信路径');break;
 case'cl-edit':post('/api/open',{id,what:'cl_md'});break;
 case'cl-draft':post('/api/cl',{id,op:'draft'},'草稿已生成并打开，②③ 段要自己写');break;
 case'cl-pdf':toast('生成中，大约 10 秒…');el.classList.add('dis');post('/api/cl',{id,op:'pdf'},'PDF 已生成');break;
 case'needcl':post('/api/needcl',{id,on:el.dataset.on==='1'});break;
 case'url':post('/api/open',{id,what:'url'});break;
 case'applied':doAct(id,'applied');break;
 case'later':doAct(id,'later');break;
 case'undo':e.stopPropagation();doAct(id,'undo');break;
 case'block':blockFor=blockFor===id?null:id;pendReason=null;render();break;
 case'reason':{const k=el.dataset.r;if(k==='company'||k==='other'){pendReason=k;render();if(k==='other')$('#note').focus()}else doAct(id,'blocked',k);break}
 case'confirm':{const n=$('#note');doAct(id,'blocked',pendReason,n?n.value.trim():'');break}
 case'cancel':pendReason=null;render();break;
 case'more':post('/api/more',{pool:el.dataset.pool},'补进来了');break;
 case'hide':post('/api/dock',{op:'hide'});break;
 case'quit':if(quitArmed)post('/api/dock',{op:'quit'});else{quitArmed=true;el.textContent='再点一次退出'}break;
 }});
document.addEventListener('focusin',e=>{if(e.target.matches('input'))api('/api/hold',{on:true}).catch(()=>{})});
document.addEventListener('focusout',e=>{if(e.target.matches('input'))api('/api/hold',{on:false}).catch(()=>{})});
load().catch(e=>toast('加载失败：'+e.message,true));
setInterval(()=>load().catch(()=>{}),300000);
</script></body></html>
