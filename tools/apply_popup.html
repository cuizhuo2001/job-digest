<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>今日投递</title>
<style>
:root{--bg:#f5f4ed;--card:#faf9f5;--ink:#3d3929;--mute:#83827d;--line:#e8e6dc;--acc:#d97757;--acc-ink:#fff;--ok:#6b8e5a;--warn:#c4472d;--amber:#d9a557;--gray:#cfcdc2;--chip:#f0eee6}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--ink:#faf9f5;--mute:#a09f99;--line:#43433f;--ok:#8fb27c;--warn:#ec8a70;--amber:#e0b46a;--gray:#5d5c57;--chip:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans SC","Microsoft YaHei UI",sans-serif;overflow:hidden}
.serif{font-family:"Noto Serif SC",Georgia,serif;font-weight:700}
#app{height:100%;display:flex;flex-direction:column;padding:14px 18px 0}
header{display:flex;align-items:center;gap:12px;padding-bottom:6px;cursor:move;user-select:none}
header h1{font:700 22px/1.2 "Noto Serif SC",Georgia,serif;margin:0}
#cnt{color:var(--mute);font-size:13px;flex:1}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 12px;flex:none}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s}
main{flex:1;overflow-y:auto;padding-bottom:18px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.col h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--mute);display:flex;justify-content:space-between}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.applied,.row.later,.row.blocked{opacity:.55}
.row.applied .co{text-decoration:line-through}
.row.open{background:var(--bg)}
.row[data-id]{cursor:pointer}
.row[data-id]:not(.open):hover{background:var(--bg)}
.row .ex{cursor:default}
.hd{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.r{background:var(--warn)}.dot.a{background:var(--amber)}.dot.g{background:var(--gray)}
.co{font:700 15px/1.3 "Noto Serif SC",Georgia,serif;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.hot{color:var(--warn);border-color:var(--warn)}
.ti{font-size:13px;margin:1px 0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.open .ti{display:block}
.meta{font-size:12px;color:var(--mute);margin-left:16px}
.ex{margin:10px 0 2px 16px;padding-top:10px;border-top:1px dashed var(--line)}
.lab{font-size:11.5px;color:var(--mute);margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{font:inherit;font-size:12px;text-align:left;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--mute);margin-right:5px;font-size:11px}
.chip:hover{border-color:var(--acc)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.line .k{font-size:12px;color:var(--mute);width:44px}
button,.btn{font:inherit;font-size:13px;font-weight:500;border-radius:9px;padding:5px 13px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.p:hover{filter:brightness(1.07)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.sm{font-size:12px;padding:2px 10px}
button.lnk{border:0;padding:0 2px;color:var(--mute);font-size:12px}
button.dis{opacity:.5;cursor:default}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reasons{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.reasons .chips{margin:4px 0 0}
.confirm{font-size:12.5px;color:var(--warn);margin:8px 0 4px}
input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 9px;flex:1;min-width:120px}
.nolink{color:var(--mute);font-size:12.5px;align-self:center}
.morebtn{display:block;width:100%;margin-top:7px;font-size:12.5px;color:var(--mute)}
.empty{margin-top:7px;border:1px dashed var(--warn);border-radius:10px;padding:7px 10px;color:var(--warn);font-size:12.5px}
.all{text-align:center;padding:10px 0 4px;font:700 18px "Noto Serif SC",Georgia,serif}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sum b{display:block;font:700 19px "Noto Serif SC",Georgia,serif}
.sum span{font-size:11.5px;color:var(--mute)}
.sub{font-size:12px;color:var(--mute);margin-top:6px;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:.92}#toast.err{background:var(--warn);color:#fff}
.tabs{display:flex;gap:4px;flex:none}
.tabs button{font-size:13px;padding:3px 12px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#me{display:none}
.me{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;align-items:start}
.mnav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--mute)}
.mnav a:hover{background:var(--card);color:var(--ink)}
.mnav em{font-style:normal;font-size:11px;min-width:18px;text-align:center;border-radius:99px;background:var(--amber);color:#fff;padding:0 5px}
.mnav .hint{font-size:11px;color:var(--mute);margin:8px 0 0 9px;line-height:1.5}
.mtool{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.mtool .file{font-size:11.5px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 11px;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--bg)}
.part{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px 6px;margin-bottom:12px}
.part h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 15px/1.3 "Noto Serif SC",Georgia,serif}
.part h3 .r{margin-left:auto;display:flex;gap:6px}
.part h3 .n{color:var(--acc);font-family:Georgia,serif}
.mk{display:inline-flex;max-width:100%;margin:0 5px 6px 0;vertical-align:top}
.mk .chip{margin:0}
.chip.todo{border-color:var(--amber);color:var(--amber);background:transparent}
.chip.ai{border-style:dashed;border-color:var(--acc)}
.chip.ai+button{border-radius:0 8px 8px 0;border-left:0;font-size:11px;padding:0 8px;color:var(--acc);border-color:var(--acc)}
.mk.ai .chip{border-radius:8px 0 0 8px}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.mcard{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:8px;background:var(--bg)}
.mcard .ct{display:flex;gap:8px;align-items:baseline;cursor:pointer;margin-bottom:2px}
.mcard .ct b{font-weight:700;font-size:13.5px}
.mcard .ct span{font-size:12px;color:var(--mute)}
.mcard .ct i{font-style:normal;margin-left:auto;font-size:11px;color:var(--amber)}
.mcard .body{margin-top:7px}
.desc{display:block;width:100%;text-align:left;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;white-space:pre-wrap;margin:0 0 6px;background:transparent;color:var(--ink);font-weight:400}
.desc small{display:block;color:var(--mute);font-size:11px;margin-bottom:2px}
.desc.ai{border-color:var(--acc)}
.fl{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:12.5px}
.fl .k{color:var(--mute);width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .fb{font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px}
.fls{margin-top:4px}
button.addf{display:block;margin:2px 0 6px;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:3px 10px}
button.addf:hover{color:var(--acc);border-color:var(--acc)}
.pi{display:flex;gap:4px;min-width:0}
.pi input{flex:1}
.fl .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr);gap:5px 8px;align-items:center;font-size:12.5px;margin-bottom:8px}
.ed .k{color:var(--mute)}
.ed .k.req::after{content:" *";color:var(--amber)}
.ed input[type=text],.ed textarea{width:100%;min-width:0;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:4px 8px}
.ed textarea{min-height:64px;resize:vertical}
.ed .h{font-size:11px;color:var(--mute)}
.edc{border:1px solid var(--line);border-radius:10px;padding:8px 10px 2px;margin-bottom:8px;background:var(--bg)}
.edc .ct{display:flex;align-items:center;margin-bottom:6px;font-size:12.5px;color:var(--mute)}
.edc .ct button{margin-left:auto}
.imp ol{margin:0 0 8px;padding-left:20px;font-size:13px;line-height:1.9}
.imp textarea{width:100%;min-height:120px;font:12px/1.5 Consolas,monospace;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px}
.imp .warnline{font-size:12px;color:var(--mute);margin:0 0 8px}
.banner{border:1px solid var(--acc);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.banner .line{margin:8px 0 0}
.bs{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.jtool{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;color:var(--mute)}
.jt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.jt td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}
.jt td b{font-weight:700}
.jt td span{color:var(--mute)}
.jt tr.off td{opacity:.5}
.jt td.why{color:var(--amber);font-size:12px;max-width:220px}
.jt td.why small{display:block;color:var(--mute);font-size:11px}
.qt{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;color:var(--mute)}
.qt button{font-size:12px;line-height:1;padding:1px 7px;border-radius:6px}
.qt b{color:var(--ink);font:700 13px Georgia,serif;min-width:16px;text-align:center}
</style></head><body>
<div id="app">
 <header class="pywebview-drag-region"><h1>今日投递</h1><div class="tabs"><button data-a="tab" data-t="jobs" id="tjobs">今日岗位</button><button data-a="tab" data-t="me" id="tme">我的资料</button></div><span id="cnt"></span>
  <span class="bs">状态栏<span class="seg" id="bstyle"></span></span>
  <button class="sm" data-a="pin" id="pinbtn" title="钉住后点别处也不收起（复制过东西会自动钉住）">钉住</button><button class="sm" data-a="hide" title="收起（Esc）">收起</button><button class="sm" data-a="quit" id="quitbtn">退出</button></header>
 <div class="bar"><i id="bar"></i></div>
 <main id="main"><div id="jobs"><div class="jtool" id="jtool"><button class="sm" data-a="jimp">＋ 导入岗位清单</button><span id="lfbtn"></span><span>学校就业中心邮件、就业网站、群里转发的，整段复制粘进来</span></div><div id="jimp"></div><div id="done"></div><div class="cols" id="cols"></div><div id="sum"></div></div><div id="me"></div></main>
</div>
<div id="toast"></div>
<script>
const T=new URLSearchParams(location.search).get('t');
let S=null,open=null,blockFor=null,pendReason=null,quitArmed=false;
const LS={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let TAB=LS.get('tab','jobs'),LANG=LS.get('lang','zh'),EDIT=null,IMP=null,PREV=null,OPENC={},IMPJ=null,LF=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){
 const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-T':T},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function load(){S=await api('/api/state');render()}
window.onShow=()=>{if(!EDIT&&!IMP&&!IMPJ&&!LF)load().catch(()=>{})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.target.matches('input,textarea'))post('/api/dock',{op:'hide'})});
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',err?4000:1600)}
async function post(path,body,msg){try{const d=await api(path,body);if(d&&d.jobs){S=d;render()}
 if(d&&d.pinned&&S&&!S.bar.pinned){S.bar.pinned=true;pinUI();if(msg)msg+='（面板先不收，用完点「收起」）'}
 if(msg)toast(msg);return true}catch(e){toast('出错：'+e.message,true);return false}}
function pinUI(){$('#pinbtn').textContent=S.bar.pinned?'已钉住':'钉住';$('#pinbtn').className='sm'+(S.bar.pinned?' on':'')}

const ORDER={pending:0,later:1,applied:2,blocked:3};
function dot(j){return j.left===null?'g':j.left<=1?'r':j.left<=30?'a':'g'}
function pill(j){
 if(j.status==='applied')return '<span class="pill">已投</span>';
 if(j.status==='later')return '<span class="pill">稍后 · 明天再来</span>';
 if(j.status==='blocked')return '<span class="pill">已屏蔽</span>';
 if(j.left===null)return '<span class="pill">招满即止</span>';
 const t=j.left===0?'今天截止':j.left===1?'明天截止':j.date+' · 剩 '+j.left+' 天';
 return '<span class="pill '+(j.left<=1?'hot':'')+'">'+t+'</span>'}
function ex(j){
 let h=`<div class="ex"><div class="line"><span class="k">简历</span><button class="sm" data-a="res-copy">复制路径</button><button class="sm" data-a="res-view">预览</button><span class="lab" style="margin:0">资料去「我的资料」复制</span></div>`;
 if(j.need_cl){
  let c;if(j.cl.pdf)c='<button class="sm" data-a="cl-copy">复制路径</button><button class="sm" data-a="cl-edit">编辑</button>';
  else if(j.cl.md)c='<button class="sm" data-a="cl-edit">编辑</button><button class="sm" data-a="cl-pdf">生成 PDF</button>';
  else c='<button class="sm" data-a="cl-draft">起草</button>';
  h+=`<div class="line"><span class="k">求职信</span>${c}${j.pool==='cn'?'<button class="lnk" data-a="needcl" data-on="0">不需要</button>':''}</div>`;
 }else h+=`<div class="line"><span class="k">求职信</span><button class="lnk" data-a="needcl" data-on="1">这家需要求职信 →</button></div>`;
 h+=`<div class="act">${j.url?'<button class="p" data-a="url">打开投递页 ↗</button>':'<button class="p" data-a="search" title="清单里没给链接，帮你搜官网申请页">搜官网 ↗</button><button data-a="setlink" title="在浏览器地址栏复制申请页网址，再点这里">粘贴链接</button>'}
  <button class="ok" data-a="applied">已投</button><button data-a="later">稍后</button><button data-a="block">屏蔽 ${blockFor===j.id?'▴':'▾'}</button>${j.url?'<button class="lnk" data-a="setlink" title="官网换了地址：在浏览器地址栏复制新网址，再点这里">改链接</button>':''}</div>`;
 if(blockFor===j.id){
  h+=`<div class="reasons"><div class="lab">屏蔽原因</div><div class="chips">${Object.entries(S.reasons).map(([r,l])=>`<button class="chip" data-a="reason" data-r="${r}" style="${pendReason===r?'border-color:var(--acc)':''}">${l}</button>`).join('')}</div>`;
  if(pendReason==='company')h+=`<div class="confirm">将屏蔽「${esc(j.company)}」的全部岗位（公司名包含这几个字的都算），以后都不再推。</div><div class="line"><button class="p sm" data-a="confirm">确定屏蔽</button><button class="sm" data-a="cancel">取消</button></div>`;
  if(pendReason==='other')h+=`<div class="line"><input type="text" id="note" placeholder="写一句原因，方便以后调规则"><button class="p sm" data-a="confirm">确定</button></div>`;
  h+='</div>'}
 return h+'</div>'}
function row(j){
 const o=open===j.id&&j.status==='pending';
 const meta=[j.type,j.city==='香港'?'':j.city,j.later?'已推迟 '+j.later+' 次':''].filter(Boolean).join(' · ');
 return `<div class="row ${j.status} ${o?'open':''}" data-id="${esc(j.id)}">
 <div class="hd" data-a="toggle"><span class="dot ${dot(j)}"></span><span class="co">${esc(j.company)}</span>${pill(j)}${j.status!=='pending'?'<button class="sm" data-a="undo">撤销</button>':''}</div>
 <div class="ti">${esc(j.title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}${o?ex(j):''}</div>`}
// ───────── 我的资料 ─────────
const isEn=()=>LANG==='en';
function fval(f,c){if(!c)return'';if(!f.bi)return c.zh||c.en||'';return (isEn()?c.en:c.zh)||''}
function xval(x){return (isEn()&&x.en?x.en:x.zh)||x.en||''}
function flab(f){return isEn()?f.en:f.zh}
function isAI(c){return !!(c&&c.ai&&c.ai.includes(LANG))}
function holders(P){return P.card?P.cards:[P]}
function todoOf(P){let n=0;holders(P).forEach(h=>P.fields.forEach(f=>{if(!f.opt&&!fval(f,h.cells[f.key]))n++}));return n}
function mask(v){return v.length<=4?'••••':v.slice(0,4)+'•'.repeat(Math.max(2,v.length-4))}
function chipM(label,v,o){
 o=o||{};
 if(!v){return o.opt?'':`<span class="mk"><button class="chip todo" data-a="medit" data-part="${o.part}" title="点开编辑"><small>${esc(label)}</small>待补</button></span>`}
 const shown=o.secret?mask(v):v,ai=o.ai&&!o.ro;
 return `<span class="mk ${ai?'ai':''}"><button class="chip ${ai?'ai':''}" data-a="mcopy" data-v="${esc(v)}" data-l="${esc(label)}" title="${esc(o.note||label)}"><small>${esc(label)}</small>${esc(shown)}</button>${ai?`<button data-a="mok" ${o.ref}>AI 翻译 · 确认</button>`:''}</span>`}
function pathOf(f,c){if(!f.bi)return {v:c.zh||'',l:'zh'};const a=isEn()?'en':'zh',b=isEn()?'zh':'en';return c[a]?{v:c[a],l:a}:{v:c[b]||'',l:b,fb:!!c[b]}}
function fileChip(P,f,c,h,ci){
 const p=pathOf(f,c),ex=((h.exists||{})[f.key]||{})[p.l],name=p.v?p.v.split(/[\\/]/).pop():'';
 if(!p.v)return f.opt?'':`<span class="mk"><button class="chip todo" data-a="medit" data-part="${P.key}"><small>${esc(flab(f))}</small>待补</button></span>`;
 const ref=`data-part="${P.key}" data-k="${f.key}" data-lang="${p.l}" ${ci!=null?`data-card="${ci}"`:''}`;
 return `<div class="fl"><span class="k" title="${esc(flab(f))}">${esc(flab(f))}</span><span class="v ${ex?'':'chip warn'}" title="${esc(p.v)}">${ex?esc(name):'找不到文件：'+esc(name)}${p.fb?`<span class="fb">只有${p.l==='zh'?'中文版':'英文版'}</span>`:''}</span><button class="sm" data-a="fcopy" ${ref}>复制路径</button><button class="sm" data-a="fview" ${ref}>预览</button></div>`}
function cellsHTML(P,h,ro,ci){

 case'block':blockFor=blockFor===id?null:id;pendReason=null;render();break;
 case'reason':{const k=el.dataset.r;if(k==='company'||k==='other'){pendReason=k;render();if(k==='other')$('#note').focus()}else doAct(id,'blocked',k);break}
 case'confirm':{const n=$('#note');doAct(id,'blocked',pendReason,n?n.value.trim():'');break}
 case'cancel':pendReason=null;render();break;
 case'more':post('/api/more',{pool:el.dataset.pool},'补进来了');break;
 case'quota':{const k=el.dataset.pool,d=+el.dataset.d;await post('/api/quota',{pool:k,delta:d},d>0?'改成每天 '+(S.quota[k]+1)+' 家，今天多补了一家':'改成每天 '+Math.max(1,S.quota[k]-1)+' 家，明天起生效');break}
 case'search':post('/api/open',{id,what:'search'});toast('找到官网申请页后，在地址栏复制网址，回来点「粘贴链接」');break;
 case'setlink':post('/api/link',{id},'链接已保存，以后都用这个');break;
 case'lf':LF={step:'copy',text:''};IMPJ=null;render();break;
 case'lfcancel':LF=null;render();break;
 case'lfback':LF.step='copy';render();break;
 case'lfcopy':post('/api/links/copy',{},'已复制 prompt，去能联网的 AI 那里粘贴');break;
 case'lfparse':{LF.text=$('#lftext').value;toast('识别中，会逐个打开链接试一下，大约 10 秒…');
  try{const r=await api('/api/links/parse',{text:LF.text});LF.items=r.items;LF.step='preview';render();$('#main').scrollTop=0}catch(e){toast(e.message,true)}break}
 case'lfpick':LF.items[+el.dataset.i].pick=el.checked;render();break;
 case'lfopen':post('/api/open',{what:'link',url:LF.items[+el.dataset.i].url});break;
 case'lfsave':try{const d=await api('/api/links/save',{items:LF.items});S=d;LF=null;render();toast('已补上 '+d.saved+' 个链接')}catch(e){toast('出错：'+e.message,true)}break;
 case'jimp':IMPJ={step:'paste',text:''};render();break;
 case'jimpcancel':IMPJ=null;render();break;
 case'jimpback':IMPJ.step='paste';render();break;
 case'jimpprompt':post('/api/clip',{text:S.jobs_prompt},'已复制 prompt，去 AI 那里粘贴，再贴上清单');break;
 case'jimpparse':{IMPJ.text=$('#jimptext').value;try{const r=await api('/api/jobs/parse',{text:IMPJ.text});IMPJ.items=r.items;IMPJ.step='preview';render();$('#main').scrollTop=0}catch(e){toast(e.message,true)}break}
 case'jpick':IMPJ.items[+el.dataset.i].pick=el.checked;render();break;
 case'jpool':{const r=IMPJ.items[+el.dataset.i];r.pool=r.pool==='hk'?'cn':'hk';r.city=r.pool==='hk'?'香港':'';render();break}
 case'jimpsave':{const n=IMPJ.items.filter(r=>r.pick).length;if(!n){toast('一条都没勾',true);break}
  try{const d=await api('/api/jobs/import',{items:IMPJ.items});S=d;IMPJ=null;render();toast('已加 '+d.added+' 条进池子：今天的名单不变，点「再来 5 家」或明天推')}catch(e){toast('出错：'+e.message,true)}break}
 case'hide':post('/api/dock',{op:'hide'});break;
 case'pin':post('/api/dock',{op:'pin'},S.bar.pinned?'取消钉住：点别处会自动收起':'钉住了：点别处也不收，用完点「收起」');break;
 case'bstyle':post('/api/dock',{op:'style',style:el.dataset.s},'状态栏换成「'+el.textContent+'」');break;
 case'quit':if(quitArmed)post('/api/dock',{op:'quit'});else{quitArmed=true;el.textContent='再点一次退出'}break;
 }});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p&&EDIT)setPath(EDIT.data,p,e.target.value);if(e.target.id==='imptext'&&IMP)IMP.text=e.target.value;if(e.target.id==='jimptext'&&IMPJ)IMPJ.text=e.target.value;if(e.target.id==='lftext'&&LF)LF.text=e.target.value});
load().catch(e=>toast('加载失败：'+e.message,true));
setInterval(()=>{if(!EDIT&&!IMP&&!IMPJ&&!LF)load().catch(()=>{})},300000);
</script></body></html>
